import groovy.json.JsonOutput

plugins {
    id 'eclipse'
    id 'idea'
    id 'java'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0,8)'
    id 'net.minecraftforge.renamer' version '1.1.8+'
    id 'net.minecraftforge.jarjar' version '0.2.3'
    id 'com.gradleup.shadow' version '9.2.2'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-${platform}-${minecraft_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${providers.systemProperty('java.version').get()}, " +
        "JVM: ${providers.systemProperty('java.vm.version').get()} (${providers.systemProperty('java.vendor').get()}), " +
        "Arch: ${providers.systemProperty('os.arch').get()}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    accessTransformer = true

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')

            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'

            args '--mixin.config', "${mod_id}.mixins.json"
            args '--mixin.config', "${mod_id}.platform.mixins.json"
        }

        register('client') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('server') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        register('gameTestServer') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

configurations {
    shade
    implementation.extendsFrom(shade)
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

jarJar.register()

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "caffeinemcRepositoryMaven"
        url = uri("https://maven.caffeinemc.net/releases")
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:$minecraft_version-$forge_version")

    // Apply Mixin AP
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Mixin Extras
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.5"))
    implementation("io.github.llamalad7:mixinextras-forge:0.5.5")
    jarJar("io.github.llamalad7:mixinextras-forge:0.5.5")

    // Mod compat: Test
    implementation renamer.dependency("maven.modrinth:GchcoXML:iQ1SwGc3") // Oculus
    implementation renamer.dependency("maven.modrinth:sk9rgfiA:UTbfe5d1") // Embeddium

    // Mod compat: Compile
    compileOnly renamer.dependency("maven.modrinth:1bokaNcj:dB6E0CY9") // Xaero's Minimap
    compileOnly renamer.dependency("maven.modrinth:9eGKb6K1:lWvbAZ3P") // Simple Voicechat

    // OpenEXR
    shade("org.lwjgl:lwjgl-tinyexr:${lwjgl_version}") {
        transitive = false
    }
    ["natives-windows", "natives-windows-arm64", "natives-linux", "natives-linux-arm64", "natives-macos", "natives-macos-arm64"].each { nativeClassifier ->
        shade("org.lwjgl:lwjgl-tinyexr:[$lwjgl_version,$lwjgl_version]:$nativeClassifier") {
            transitive = false
        }
    }

    // MP4Parser
    shade "com.googlecode.mp4parser:isoparser:1.1.22"

    // JGLTF
    shade "de.javagl:jgltf-model:${jgltf_version}"
    shade "de.javagl:jgltf-impl-v1:${jgltf_version}"
    shade "de.javagl:jgltf-impl-v2:${jgltf_version}"

    // Jackson
    shade "com.fasterxml.jackson.core:jackson-core:${jackson_version}"
    shade "com.fasterxml.jackson.core:jackson-annotations:${jackson_version}"
    shade "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
}

tasks.named('shadowJar') {
    configurations = [project.configurations.shade]
    archiveClassifier = 'unobfuscated'
    destinationDirectory = layout.buildDirectory.dir('intermediates')

    addMultiReleaseAttribute = false

    def jarJarTask = tasks.named('jarJar')
    dependsOn jarJarTask
    from(zipTree(jarJarTask.flatMap { it.archiveFile })) {
        include 'META-INF/jarjar/**'
    }

    relocate('com.fasterxml.jackson', "${libs_path}.jackson")
    relocate('com.googlecode.mp4parser', "${libs_path}.googlecode.mp4parser")
    relocate('com.coremedia.iso', "${libs_path}.coremedia.iso")
    relocate('com.mp4parser', "${libs_path}.mp4parser")
    relocate('org.mp4parser.aspectj', "${libs_path}.mp4parser.aspectj")
    relocate('de.javagl.jgltf', "${libs_path}.jgltf")
    mergeServiceFiles()

    from(sourceSets.main.output)
    def jarTask = tasks.named("jar")
    dependsOn jarTask
    from(zipTree(jarTask.flatMap { it.archiveFile })) {
        include "${mod_id}.refmap.json"
    }

    manifest {
        attributes(['MixinConfigs': "${mod_id}.mixins.json,${mod_id}.platform.mixins.json"])
    }

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/versions/**'
    exclude 'module-info.class'
}

def convertLang = tasks.register("convertLang") {
    def modId = project.mod_id
    def inDir = layout.projectDirectory.dir("src/main/lang")
    def outDir = layout.buildDirectory.dir("generated/lang")
    inputs.dir(inDir).optional()
    outputs.dir(outDir)
    doLast {
        def out = outDir.get().dir("assets/${modId}/lang").asFile
        out.deleteDir(); out.mkdirs()
        def src = inDir.asFile
        if (!src.exists()) return
        src.eachFileMatch(~/[a-z]{2}_[A-Za-z]{2}\.lang/) { f ->
            def map = new LinkedHashMap<String, String>()
            f.eachLine("UTF-8") { line ->
                if (line.trim().isEmpty() || line.trim().startsWith("#")) return
                int i = line.indexOf('=')
                if (i < 0) return
                def key = line.substring(0, i)
                def value = line.substring(i + 1)
                if (key.startsWith("${modId}.input.")) {
                    map.put(key, value)
                    key = "key.${modId}." + key.substring("${modId}.input.".length())
                }
                if (key == "${modId}.title") map.put("key.category.${modId}.general", value)
                map.put(key, value)
            }
            new File(out, f.name.toLowerCase().replace(".lang", ".json")).setText(JsonOutput.prettyPrint(JsonOutput.toJson(map)), "UTF-8")
        }
    }
}
sourceSets.main.resources.srcDir convertLang

tasks.named('processResources', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.property('replaceProperties', replaceProperties)

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "${mod_id}.mixins.json,${mod_id}.platform.mixins.json"
        ])
    }
    archiveClassifier = 'slim-unobfuscated'
    destinationDirectory = layout.buildDirectory.dir('intermediates')
}

tasks.named('jarJar') {
    archiveClassifier = 'all-unobfuscated'
    destinationDirectory = layout.buildDirectory.dir('intermediates')
}

renamer.mappings.from minecraft.dependency.toSrgFile

renamer.enableMixinRefmaps {
    config "${mod_id}.mixins.json"
    config "${mod_id}.platform.mixins.json"
    refMap = "${mod_id}.refmap.json"
}

renamer.classes(tasks.named('shadowJar')) {
    archiveClassifier = ''
    mappings renamer.mixin.generatedMappings
}

tasks.named('build') {
    dependsOn 'renameShadowJar'
}

publishing {
    repositories {
        maven { url = layout.projectDirectory.dir('mcmodsrepo').asFile.toURI() }
    }

    publications.register('mavenJava', MavenPublication) {
        artifact renameShadowJar
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea.module {
    downloadJavadoc = downloadSources = true
}
