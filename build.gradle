import groovy.json.JsonOutput

import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("src/generated/**/.cache")
}

def tinyexrGroup = "net.patchedpixel.shaded-tinyexr"
def tinyexrArtifact = "tinyexr-all"
def tinyexrRepoDir = layout.buildDirectory.dir("lib-shading").get().asFile
def tinyexrOutDir = new File(tinyexrRepoDir, "${tinyexrGroup.replace('.', '/')}/${tinyexrArtifact}/${lwjgl_version}")
def tinyexrOutJar = new File(tinyexrOutDir, "${tinyexrArtifact}-${lwjgl_version}.jar")

def jgltfGroup = "net.patchedpixel.shaded-jgltf"
def jacksonGroup = "net.patchedpixel.shaded-jgltf"

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "caffeinemcRepositoryMaven"
        url = uri("https://maven.caffeinemc.net/releases")
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "ShadedLibs"
                url = tinyexrRepoDir.toURI()
            }
        }
        filter {
            includeGroup tinyexrGroup
            includeGroup jgltfGroup
            includeGroup jacksonGroup
        }
    }
}

if (!tinyexrOutJar.exists()) {
    def tinyexrNatives = ["natives-windows", "natives-windows-arm64", "natives-linux", "natives-linux-arm64", "natives-macos", "natives-macos-arm64"]
    def tinyexrDeps = [dependencies.create("org.lwjgl:lwjgl-tinyexr:${lwjgl_version}")]
    tinyexrNatives.each { n -> tinyexrDeps << dependencies.create("org.lwjgl:lwjgl-tinyexr:${lwjgl_version}:${n}") }
    def tinyexrConfig = configurations.detachedConfiguration(*tinyexrDeps)
    tinyexrConfig.transitive = false

    tinyexrOutDir.mkdirs()
    def seen = new HashSet<String>()
    new ZipOutputStream(new FileOutputStream(tinyexrOutJar)).withCloseable { out ->
        tinyexrConfig.resolve().sort { it.name.length() }.each { jar ->
            new ZipFile(jar).withCloseable { zip ->
                zip.entries().each { e ->
                    def name = e.name
                    if (e.isDirectory() || name.startsWith("META-INF/") && (name.endsWith(".SF") || name.endsWith(".RSA") || name.endsWith(".DSA"))) return
                    if (!seen.add(name)) return
                    out.putNextEntry(new ZipEntry(name))
                    zip.getInputStream(e).withCloseable { it.transferTo(out) }
                    out.closeEntry()
                }
            }
        }
    }
    new File(tinyexrOutDir, "${tinyexrArtifact}-${lwjgl_version}.pom").text = """<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0">
  <modelVersion>4.0.0</modelVersion>
  <groupId>${tinyexrGroup}</groupId>
  <artifactId>${tinyexrArtifact}</artifactId>
  <version>${lwjgl_version}</version>
</project>
"""
}

def mergeJars = { String group, String artifact, String version, String moduleName, List<String> coords ->
    def outDir = new File(tinyexrRepoDir, "${group.replace('.', '/')}/${artifact}/${version}")
    def outJar = new File(outDir, "${artifact}-${version}.jar")
    if (!outJar.exists()) {
        outDir.mkdirs()
        def cfg = configurations.detachedConfiguration(*coords.collect { dependencies.create(it) })
        cfg.transitive = false

        def seen = new HashSet<String>()
        def services = new LinkedHashMap<String, LinkedHashSet<String>>()
        new ZipOutputStream(new FileOutputStream(outJar)).withCloseable { out ->
            cfg.resolve().each { jar ->
                new ZipFile(jar).withCloseable { zip ->
                    zip.entries().each { e ->
                        def name = e.name
                        if (e.isDirectory()) return
                        if (name == "META-INF/MANIFEST.MF") return
                        if (name.startsWith("META-INF/") && (name.endsWith(".SF") || name.endsWith(".RSA") || name.endsWith(".DSA"))) return
                        if (name == "module-info.class" || name ==~ /META-INF\/versions\/\d+\/module-info\.class/) return
                        if (name.startsWith("META-INF/services/")) {
                            zip.getInputStream(e).withCloseable { ins ->
                                services.computeIfAbsent(name) { new LinkedHashSet<String>() }
                                        .addAll(ins.getText("UTF-8").readLines().findAll { it.trim() })
                            }
                            return
                        }
                        if (!seen.add(name)) return
                        out.putNextEntry(new ZipEntry(name))
                        zip.getInputStream(e).withCloseable { it.transferTo(out) }
                        out.closeEntry()
                    }
                }
            }
            services.each { name, lines ->
                out.putNextEntry(new ZipEntry(name))
                out.write((lines.join("\n") + "\n").getBytes("UTF-8"))
                out.closeEntry()
            }
            out.putNextEntry(new ZipEntry("META-INF/MANIFEST.MF"))
            out.write("Manifest-Version: 1.0\r\nAutomatic-Module-Name: ${moduleName}\r\nMulti-Release: true\r\n\r\n".getBytes("UTF-8"))
            out.closeEntry()
        }
        new File(outDir, "${artifact}-${version}.pom").text = """<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0">
  <modelVersion>4.0.0</modelVersion>
  <groupId>${group}</groupId>
  <artifactId>${artifact}</artifactId>
  <version>${version}</version>
</project>
"""
    }
}

def jgltfArtifact = "jgltf-all"
def jgltfMergedVersion = jgltf_version
mergeJars(jgltfGroup, jgltfArtifact, jgltfMergedVersion, "net.patchedpixel.shaded.jgltf", [
        "de.javagl:jgltf-model:${jgltf_version}",
        "de.javagl:jgltf-impl-v1:${jgltf_version}",
        "de.javagl:jgltf-impl-v2:${jgltf_version}"
])

def jacksonArtifact = "jackson-all"
def jacksonMergedVersion = jackson_version
mergeJars(jacksonGroup, jacksonArtifact, jacksonMergedVersion, "net.patchedpixel.shaded.jackson", [
        "com.fasterxml.jackson.core:jackson-core:${jackson_version}",
        "com.fasterxml.jackson.core:jackson-annotations:${jackson_version}",
        "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
])

base {
    archivesName = "${mod_id}-${platform}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
//            systemProperty 'scenecraft.generateScbinMapping', 'true'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Mod compat
    compileOnly("maven.modrinth:YL57xq9U:Ag5S66CF") // Iris Shaders
    compileOnly("maven.modrinth:1bokaNcj:j2Xo3Dhc") // Xaero's Minimap
    compileOnly("maven.modrinth:9eGKb6K1:3rpCvvMZ") // Simple Voice Chat
    compileOnly("net.caffeinemc:sodium-neoforge-mod:0.9.3-beta.1+mc26.3") // Sodium

    // OpenEXR lib
    implementation(jarJar("${tinyexrGroup}:${tinyexrArtifact}:${lwjgl_version}"))

    // Project lib
    implementation(jarJar("com.googlecode.mp4parser:isoparser:1.1.22"))
    implementation(jarJar("${jgltfGroup}:${jgltfArtifact}:${jgltfMergedVersion}"))
    implementation(jarJar("${jacksonGroup}:${jacksonArtifact}:${jacksonMergedVersion}"))
}

def convertLang = tasks.register("convertLang") {
    def modId = project.mod_id
    def inDir = layout.projectDirectory.dir("src/main/lang")
    def outDir = layout.buildDirectory.dir("generated/lang")
    inputs.dir(inDir).optional()
    outputs.dir(outDir)
    doLast {
        def out = outDir.get().dir("assets/${modId}/lang").asFile
        out.deleteDir(); out.mkdirs()
        def src = inDir.asFile
        if (!src.exists()) return
        src.eachFileMatch(~/[a-z]{2}_[A-Za-z]{2}\.lang/) { f ->
            def map = new LinkedHashMap<String, String>()
            f.eachLine("UTF-8") { line ->
                if (line.trim().isEmpty() || line.trim().startsWith("#")) return
                int i = line.indexOf('=')
                if (i < 0) return
                def key = line.substring(0, i)
                def value = line.substring(i + 1)
                if (key.startsWith("${modId}.input.")) {
                    map.put(key, value)
                    key = "key.${modId}." + key.substring("${modId}.input.".length())
                }
                if (key == "${modId}.title") map.put("key.category.${modId}.general", value)
                map.put(key, value)
            }
            new File(out, f.name.toLowerCase().replace(".lang", ".json")).setText(JsonOutput.prettyPrint(JsonOutput.toJson(map)), "UTF-8")
        }
    }
}
sourceSets.main.resources.srcDir convertLang

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}
neoForge.ideSyncTask tasks.named('processResources')

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
