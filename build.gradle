import groovy.json.JsonOutput

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.gradleup.shadow' version '9.2.2'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${platform}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "caffeinemcRepositoryMaven"
        url = uri("https://maven.caffeinemc.net/releases")
    }
}

neoForge {
    version = project.neo_version

    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
//            systemProperty 'scenecraft.generateScbinMapping', 'true'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    shade
    implementation.extendsFrom(shade)
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Mod compat
    compileOnly("maven.modrinth:YL57xq9U:k55HdONq") // Iris Shaders
    compileOnly("maven.modrinth:1bokaNcj:ja3RzZIV") // Xaero's Minimap
    compileOnly("maven.modrinth:9eGKb6K1:sT38GqTp") // Simple Voice Chat
    compileOnly("net.caffeinemc:sodium-neoforge-mod:0.9.2+mc26.2") // Sodium

    // OpenEXR
    shade("org.lwjgl:lwjgl-tinyexr:${lwjgl_version}") {
        transitive = false
    }
    ["natives-windows", "natives-windows-arm64", "natives-linux", "natives-linux-arm64", "natives-macos", "natives-macos-arm64"].each { nativeClassifier ->
        shade("org.lwjgl:lwjgl-tinyexr:${lwjgl_version}:${nativeClassifier}") {
            transitive = false
        }
    }

    // MP4Parser
    shade "com.googlecode.mp4parser:isoparser:1.1.22"

    // JGLTF
    shade "de.javagl:jgltf-model:${jgltf_version}"
    shade "de.javagl:jgltf-impl-v1:${jgltf_version}"
    shade "de.javagl:jgltf-impl-v2:${jgltf_version}"

    // Jackson
    shade "com.fasterxml.jackson.core:jackson-core:${jackson_version}"
    shade "com.fasterxml.jackson.core:jackson-annotations:${jackson_version}"
    shade "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
}

tasks.named('shadowJar') {
    configurations = [project.configurations.shade]
    archiveClassifier = ''

    relocate('com.fasterxml.jackson', 'net.patchedpixel.scenecraft.libs.jackson')
    relocate('com.googlecode.mp4parser', 'net.patchedpixel.scenecraft.libs.googlecode.mp4parser')
    relocate('com.coremedia.iso', 'net.patchedpixel.scenecraft.libs.coremedia.iso')
    relocate('com.mp4parser', 'net.patchedpixel.scenecraft.libs.mp4parser')
    relocate('org.mp4parser.aspectj', 'net.patchedpixel.scenecraft.libs.mp4parser.aspectj')
    relocate('de.javagl.jgltf', 'net.patchedpixel.scenecraft.libs.jgltf')
    mergeServiceFiles()

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'

    exclude 'module-info.class'
    exclude 'META-INF/versions/*/module-info.class'
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
}

tasks.named('build').configure {
    dependsOn 'shadowJar'
}

def convertLang = tasks.register("convertLang") {
    def modId = project.mod_id
    def inDir = layout.projectDirectory.dir("src/main/lang")
    def outDir = layout.buildDirectory.dir("generated/lang")
    inputs.dir(inDir).optional()
    outputs.dir(outDir)
    doLast {
        def out = outDir.get().dir("assets/${modId}/lang").asFile
        out.deleteDir(); out.mkdirs()
        def src = inDir.asFile
        if (!src.exists()) return
        src.eachFileMatch(~/[a-z]{2}_[A-Za-z]{2}\.lang/) { f ->
            def map = new LinkedHashMap<String, String>()
            f.eachLine("UTF-8") { line ->
                if (line.trim().isEmpty() || line.trim().startsWith("#")) return
                int i = line.indexOf('=')
                if (i < 0) return
                def key = line.substring(0, i)
                def value = line.substring(i + 1)
                if (key.startsWith("${modId}.input.")) {
                    map.put(key, value)
                    key = "key.${modId}." + key.substring("${modId}.input.".length())
                }
                if (key == "${modId}.title") map.put("key.category.${modId}.general", value)
                map.put(key, value)
            }
            new File(out, f.name.toLowerCase().replace(".lang", ".json")).setText(JsonOutput.prettyPrint(JsonOutput.toJson(map)), "UTF-8")
        }
    }
}
sourceSets.main.resources.srcDir convertLang

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}
neoForge.ideSyncTask tasks.named('processResources')

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact tasks.named('shadowJar')
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
