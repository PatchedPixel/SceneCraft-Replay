import groovy.json.JsonOutput

import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${platform}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def tinyexrGroup = "net.patchedpixel.shaded-tinyexr"
def tinyexrArtifact = "tinyexr-all"
def tinyexrRepoDir = layout.buildDirectory.dir("lib-shading").get().asFile
def tinyexrOutDir = new File(tinyexrRepoDir, "${tinyexrGroup.replace('.', '/')}/${tinyexrArtifact}/${lwjgl_version}")
def tinyexrOutJar = new File(tinyexrOutDir, "${tinyexrArtifact}-${lwjgl_version}.jar")

def jgltfGroup = "net.patchedpixel.shaded-jgltf"
def jacksonGroup = "net.patchedpixel.shaded-jgltf"

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        forRepositories(fg.repository)
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "caffeinemcRepositoryMaven"
        url = uri("https://maven.caffeinemc.net/releases")
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "ShadedLibs"
                url = tinyexrRepoDir.toURI()
            }
        }
        filter {
            includeGroup tinyexrGroup
            includeGroup jgltfGroup
            includeGroup jacksonGroup
        }
    }
}

if (!tinyexrOutJar.exists()) {
    def tinyexrNatives = ["natives-windows", "natives-windows-arm64", "natives-linux", "natives-linux-arm64", "natives-macos", "natives-macos-arm64"]
    def tinyexrDeps = [dependencies.create("org.lwjgl:lwjgl-tinyexr:${lwjgl_version}")]
    tinyexrNatives.each { n -> tinyexrDeps << dependencies.create("org.lwjgl:lwjgl-tinyexr:${lwjgl_version}:${n}") }
    def tinyexrConfig = configurations.detachedConfiguration(*tinyexrDeps)
    tinyexrConfig.transitive = false

    tinyexrOutDir.mkdirs()
    def seen = new HashSet<String>()
    new ZipOutputStream(new FileOutputStream(tinyexrOutJar)).withCloseable { out ->
        tinyexrConfig.resolve().sort { it.name.length() }.each { jar ->
            new ZipFile(jar).withCloseable { zip ->
                zip.entries().each { e ->
                    def name = e.name
                    if (e.isDirectory() || name.startsWith("META-INF/") && (name.endsWith(".SF") || name.endsWith(".RSA") || name.endsWith(".DSA"))) return
                    if (!seen.add(name)) return
                    out.putNextEntry(new ZipEntry(name))
                    zip.getInputStream(e).withCloseable { it.transferTo(out) }
                    out.closeEntry()
                }
            }
        }
    }
    new File(tinyexrOutDir, "${tinyexrArtifact}-${lwjgl_version}.pom").text = """<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0">
  <modelVersion>4.0.0</modelVersion>
  <groupId>${tinyexrGroup}</groupId>
  <artifactId>${tinyexrArtifact}</artifactId>
  <version>${lwjgl_version}</version>
</project>
"""
}

// Generate Maven metadata for the locally shaded TinyEXR artifact.
def tinyexrArtifactDir = new File(tinyexrRepoDir, "${tinyexrGroup.replace('.', '/')}/${tinyexrArtifact}")
tinyexrArtifactDir.mkdirs()

new File(tinyexrOutDir, "${tinyexrArtifact}-${lwjgl_version}.pom").text = """\
<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0">
    <modelVersion>4.0.0</modelVersion>
    <groupId>${tinyexrGroup}</groupId>
    <artifactId>${tinyexrArtifact}</artifactId>
    <version>${lwjgl_version}</version>
</project>
"""

new File(tinyexrArtifactDir, "maven-metadata.xml").text = """\
<?xml version="1.0" encoding="UTF-8"?>
<metadata>
    <groupId>${tinyexrGroup}</groupId>
    <artifactId>${tinyexrArtifact}</artifactId>
    <versioning>
        <release>${lwjgl_version}</release>
        <versions>
            <version>${lwjgl_version}</version>
        </versions>
    </versioning>
</metadata>
"""

def mergeJars = { String group, String artifact, String version, String moduleName, List<String> coords ->
    def outDir = new File(tinyexrRepoDir, "${group.replace('.', '/')}/${artifact}/${version}")
    def outJar = new File(outDir, "${artifact}-${version}.jar")
    if (!outJar.exists()) {
        outDir.mkdirs()
        def cfg = configurations.detachedConfiguration(*coords.collect { dependencies.create(it) })
        cfg.transitive = false

        def seen = new HashSet<String>()
        def services = new LinkedHashMap<String, LinkedHashSet<String>>()
        new ZipOutputStream(new FileOutputStream(outJar)).withCloseable { out ->
            cfg.resolve().each { jar ->
                new ZipFile(jar).withCloseable { zip ->
                    zip.entries().each { e ->
                        def name = e.name
                        if (e.isDirectory()) return
                        if (name == "META-INF/MANIFEST.MF") return
                        if (name.startsWith("META-INF/") && (name.endsWith(".SF") || name.endsWith(".RSA") || name.endsWith(".DSA"))) return
                        if (name == "module-info.class" || name ==~ /META-INF\/versions\/\d+\/module-info\.class/) return
                        if (name.startsWith("META-INF/services/")) {
                            zip.getInputStream(e).withCloseable { ins ->
                                services.computeIfAbsent(name) { new LinkedHashSet<String>() }
                                        .addAll(ins.getText("UTF-8").readLines().findAll { it.trim() })
                            }
                            return
                        }
                        if (!seen.add(name)) return
                        out.putNextEntry(new ZipEntry(name))
                        zip.getInputStream(e).withCloseable { it.transferTo(out) }
                        out.closeEntry()
                    }
                }
            }
            services.each { name, lines ->
                out.putNextEntry(new ZipEntry(name))
                out.write((lines.join("\n") + "\n").getBytes("UTF-8"))
                out.closeEntry()
            }
            out.putNextEntry(new ZipEntry("META-INF/MANIFEST.MF"))
            out.write("Manifest-Version: 1.0\r\nAutomatic-Module-Name: ${moduleName}\r\nMulti-Release: true\r\n\r\n".getBytes("UTF-8"))
            out.closeEntry()
        }
        new File(outDir, "${artifact}-${version}.pom").text = """<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0">
  <modelVersion>4.0.0</modelVersion>
  <groupId>${group}</groupId>
  <artifactId>${artifact}</artifactId>
  <version>${version}</version>
</project>
"""
    }
}

def jgltfArtifact = "jgltf-all"
def jgltfMergedVersion = jgltf_version
mergeJars(jgltfGroup, jgltfArtifact, jgltfMergedVersion, "net.patchedpixel.shaded.jgltf", [
        "de.javagl:jgltf-model:${jgltf_version}",
        "de.javagl:jgltf-impl-v1:${jgltf_version}",
        "de.javagl:jgltf-impl-v2:${jgltf_version}"
])

def jacksonArtifact = "jackson-all"
def jacksonMergedVersion = jackson_version
mergeJars(jacksonGroup, jacksonArtifact, jacksonMergedVersion, "net.patchedpixel.shaded.jackson", [
        "com.fasterxml.jackson.core:jackson-core:${jackson_version}",
        "com.fasterxml.jackson.core:jackson-annotations:${jackson_version}",
        "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
])

jarJar.enable()

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Apply Mixin AP
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Mixin Extras
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.5"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.5")) {
        jarJar.ranged(it, "[0.5.5,)")
    }

    // Mod compat
    compileOnly("maven.modrinth:GchcoXML:iQ1SwGc3") // Oculus
    compileOnly("maven.modrinth:sk9rgfiA:UTbfe5d1") // Embeddium
    compileOnly("maven.modrinth:1bokaNcj:dB6E0CY9") // Xaero's Minimap
    compileOnly("maven.modrinth:9eGKb6K1:lWvbAZ3P") // Simple Voice Chat

    // OpenEXR lib
    implementation "${tinyexrGroup}:${tinyexrArtifact}:${lwjgl_version}"
    jarJar("$tinyexrGroup:$tinyexrArtifact:[$lwjgl_version]") {
        jarJar.pin(it, lwjgl_version)
    }

    // Project lib
    implementation "com.googlecode.mp4parser:isoparser:1.1.22"
    jarJar("com.googlecode.mp4parser:isoparser:[1.1.22]") {
        jarJar.pin(it, "1.1.22")
    }
    // JGLtf lib
    implementation "${jgltfGroup}:${jgltfArtifact}:${jgltfMergedVersion}"
    jarJar("${jgltfGroup}:${jgltfArtifact}:[${jgltfMergedVersion}]") {
        jarJar.pin(it, jgltfMergedVersion)
    }
    // Jackson lib
    implementation "${jacksonGroup}:${jacksonArtifact}:${jacksonMergedVersion}"
    jarJar("${jacksonGroup}:${jacksonArtifact}:[${jacksonMergedVersion}]") {
        jarJar.pin(it, jacksonMergedVersion)
    }
}

def convertLang = tasks.register("convertLang") {
    def modId = project.mod_id
    def inDir = layout.projectDirectory.dir("src/main/lang")
    def outDir = layout.buildDirectory.dir("generated/lang")
    inputs.dir(inDir).optional()
    outputs.dir(outDir)
    doLast {
        def out = outDir.get().dir("assets/${modId}/lang").asFile
        out.deleteDir(); out.mkdirs()
        def src = inDir.asFile
        if (!src.exists()) return
        src.eachFileMatch(~/[a-z]{2}_[A-Za-z]{2}\.lang/) { f ->
            def map = new LinkedHashMap<String, String>()
            f.eachLine("UTF-8") { line ->
                if (line.trim().isEmpty() || line.trim().startsWith("#")) return
                int i = line.indexOf('=')
                if (i < 0) return
                def key = line.substring(0, i)
                def value = line.substring(i + 1)
                if (key.startsWith("${modId}.input.")) {
                    map.put(key, value)
                    key = "key.${modId}." + key.substring("${modId}.input.".length())
                }
                if (key == "${modId}.title") map.put("key.category.${modId}.general", value)
                map.put(key, value)
            }
            new File(out, f.name.toLowerCase().replace(".lang", ".json")).setText(JsonOutput.prettyPrint(JsonOutput.toJson(map)), "UTF-8")
        }
    }
}
sourceSets.main.resources.srcDir convertLang

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

reobf {
    jarJar {}
}

tasks.named('jarJar').configure {
    finalizedBy 'reobfJarJar'
}

tasks.named('build').configure {
    dependsOn 'jarJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
