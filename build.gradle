import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
import groovy.json.JsonOutput

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.gradleup.shadow' version '8.3.6'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${platform}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
    config "${mod_id}.platform.mixins.json"
}

configurations {
    shade
    implementation.extendsFrom(shade)
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        forRepositories(fg.repository)
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "caffeinemcRepositoryMaven"
        url = uri("https://maven.caffeinemc.net/releases")
    }
}

jarJar.enable()

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Apply Mixin AP
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Mixin Extras
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.5"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.5")) {
        jarJar.ranged(it, "[0.5.5,)")
    }

    // Mod compat: Test
    implementation fg.deobf("maven.modrinth:GchcoXML:iQ1SwGc3") // Oculus
    implementation fg.deobf("maven.modrinth:sk9rgfiA:UTbfe5d1") // Embeddium

    // Mod compat: Compile
    compileOnly("maven.modrinth:1bokaNcj:dB6E0CY9") // Xaero's Minimap
    compileOnly("maven.modrinth:9eGKb6K1:lWvbAZ3P") // Simple Voicechat

    // OpenEXR
    shade("org.lwjgl:lwjgl-tinyexr:${lwjgl_version}") {
        transitive = false
    }
    ["natives-windows", "natives-windows-arm64", "natives-linux", "natives-linux-arm64", "natives-macos", "natives-macos-arm64"].each {nativeClassifier ->
        shade("org.lwjgl:lwjgl-tinyexr:[$lwjgl_version,$lwjgl_version]:$nativeClassifier") {
            transitive = false
        }
    }

    // MP4Parser
    shade "com.googlecode.mp4parser:isoparser:1.1.22"

    // JGLTF
    shade "de.javagl:jgltf-model:${jgltf_version}"
    shade "de.javagl:jgltf-impl-v1:${jgltf_version}"
    shade "de.javagl:jgltf-impl-v2:${jgltf_version}"

    // Jackson
    shade "com.fasterxml.jackson.core:jackson-core:${jackson_version}"
    shade "com.fasterxml.jackson.core:jackson-annotations:${jackson_version}"
    shade "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"
}

tasks.named('shadowJar', ShadowJar) {
    configurations = [project.configurations.shade]
    archiveClassifier = ''

    relocate('com.fasterxml.jackson', 'net.patchedpixel.scenecraft.libs.jackson')
    relocate('com.googlecode.mp4parser', 'net.patchedpixel.scenecraft.libs.googlecode.mp4parser')
    relocate('com.coremedia.iso', 'net.patchedpixel.scenecraft.libs.coremedia.iso')
    relocate('com.mp4parser', 'net.patchedpixel.scenecraft.libs.mp4parser')
    relocate('org.mp4parser.aspectj', 'net.patchedpixel.scenecraft.libs.mp4parser.aspectj')
    relocate('de.javagl.jgltf', 'net.patchedpixel.scenecraft.libs.jgltf')
    mergeServiceFiles()

    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

tasks.named('shadowJar').configure {
    finalizedBy 'reobfShadowJar'
}

def convertLang = tasks.register("convertLang") {
    def modId = project.mod_id
    def inDir = layout.projectDirectory.dir("src/main/lang")
    def outDir = layout.buildDirectory.dir("generated/lang")
    inputs.dir(inDir).optional()
    outputs.dir(outDir)
    doLast {
        def out = outDir.get().dir("assets/${modId}/lang").asFile
        out.deleteDir(); out.mkdirs()
        def src = inDir.asFile
        if (!src.exists()) return
        src.eachFileMatch(~/[a-z]{2}_[A-Za-z]{2}\.lang/) { f ->
            def map = new LinkedHashMap<String, String>()
            f.eachLine("UTF-8") { line ->
                if (line.trim().isEmpty() || line.trim().startsWith("#")) return
                int i = line.indexOf('=')
                if (i < 0) return
                def key = line.substring(0, i)
                def value = line.substring(i + 1)
                if (key.startsWith("${modId}.input.")) {
                    map.put(key, value)
                    key = "key.${modId}." + key.substring("${modId}.input.".length())
                }
                if (key == "${modId}.title") map.put("key.category.${modId}.general", value)
                map.put(key, value)
            }
            new File(out, f.name.toLowerCase().replace(".lang", ".json")).setText(JsonOutput.prettyPrint(JsonOutput.toJson(map)), "UTF-8")
        }
    }
}
sourceSets.main.resources.srcDir convertLang

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version           : forge_version,
            forge_version_range     : forge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

reobf {
    jarJar {}
    shadowJar {}
}

tasks.named('jarJar').configure {
    finalizedBy 'reobfJarJar'
}

tasks.named('build').configure {
    dependsOn 'jarJar'
    dependsOn 'reobfShadowJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
