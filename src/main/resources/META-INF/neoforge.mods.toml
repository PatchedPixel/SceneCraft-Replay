modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="PatchedPixel"
credits="johni0702 and CrushedPixel as original ReplayMod developers"
issueTrackerURL="https://github.com/PatchedPixel/SceneCraft-Replay/issues"
displayURL="https://www.curseforge.com/minecraft/mc-mods/scenecraft-replay"
iconFile="assets/scenecraft/favicon_logo.png"
bannerFile="scenecraft_logo.png"
description='''
Record your world, replay it from any angle, and render it as cinematic video. A modern ReplayMod-based project.
'''

[[mixins]]
config="scenecraft.mixins.json"

[[mixins]]
config="scenecraft.platform.mixins.json"

# FRAPI intregation
[modproperties.${mod_id}]
"frex:flawless_frames_handler" = "net.patchedpixel.scenecraft.common.render.utils.FlawlessFrames"

# Better Mod List integration
[modproperties.modmenu]
badges=["client"]
links=[
    "Original Mod=https://modrinth.com/mod/replaymod",
    "Modrinth=https://modrinth.com/mod/scenecraft-replay",
    "CurseForge=https://www.curseforge.com/minecraft/mc-mods/scenecraft-replay"
]
contributors=[]
sources="https://github.com/PatchedPixel/SceneCraft-Replay"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[26.2.0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
